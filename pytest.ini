[pytest]
testpaths = tests
# `-ra` surfaces the reason for every skip. Several fixtures skip when the
# database has no suitable record, and a silent skip reads as a pass -- the
# exact failure mode conftest's seeded-database check exists to prevent.
addopts = -ra
filterwarnings =
    # Third-party deprecations we do not control, muted so a real warning from
    # our own code is visible rather than buried in four lines of noise.
    ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient`.*
